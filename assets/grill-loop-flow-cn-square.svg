<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">是选项，不是阶段</title>
  <desc id="desc">grill-loop 根据当前工作重新判断下一项最有价值的能力</desc>
  <rect width="1200" height="1200" fill="#111820"/>
  <g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
    <text x="88" y="126" fill="#f3f7fa" font-size="60" font-weight="760">是选项，不是阶段。</text>
    <text x="90" y="178" fill="#9ba8b4" font-size="24">最新结果决定下一项最有价值的能力。</text>
  </g>
  <g fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round">
    <path d="M600 550C600 370 430 304 286 360"/>
    <path d="M600 550C600 370 770 304 914 360"/>
    <path d="M600 650C600 830 430 896 286 840"/>
    <path d="M600 650C600 830 770 896 914 840"/>
  </g>
  <g fill="#111820" stroke="#5eead4" stroke-width="5">
    <rect x="424" y="514" width="352" height="172" rx="24"/>
    <rect x="122" y="300" width="292" height="124" rx="18"/>
    <rect x="786" y="300" width="292" height="124" rx="18"/>
    <rect x="122" y="776" width="292" height="124" rx="18"/>
    <rect x="786" y="776" width="292" height="124" rx="18"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">
    <text x="600" y="582" fill="#5eead4" font-size="22">当前工作</text>
    <text x="600" y="636" fill="#f3f7fa" font-size="31">目标＋产物</text>
    <text x="268" y="374" fill="#f3f7fa" font-size="28">grilling</text>
    <text x="932" y="374" fill="#f3f7fa" font-size="28">deep-grill</text>
    <text x="268" y="850" fill="#f3f7fa" font-size="28">OpenSpec</text>
    <text x="932" y="850" fill="#f3f7fa" font-size="28">taste＋更多</text>
  </g>
  <text x="600" y="1062" fill="#9ba8b4" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" text-anchor="middle">选一个，遵循它的契约，再重新判断。</text>
</svg>
